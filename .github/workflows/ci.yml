name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Скачать репозиторий
      uses: actions/checkout@v4

    - name: Сборка драйвера
      run:
        make -C "$GITHUB_WORKSPACE/driver"

    - name: Установка зависимостей
      run:
        make -C "$GITHUB_WORKSPACE/userspace_app" install-dep
    
    - name: Сборка приложения
      run: |
        make -C "$GITHUB_WORKSPACE/userspace_app" comp
    
